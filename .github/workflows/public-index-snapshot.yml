name: Public index snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 1 * *'

concurrency:
  group: public-index-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    name: Capture public repository facts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Capture public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync-public-index.py
      - name: Upload dated snapshot
        uses: actions/upload-artifact@v7
        with:
          name: public-index-snapshot
          path: docs/public-index-*.json
          retention-days: 90
