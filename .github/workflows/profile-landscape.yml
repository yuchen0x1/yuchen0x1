name: Profile landscape snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 1 * *'

concurrency:
  group: profile-landscape
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect public profile references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/research-profiles.py --output-dir "${{ runner.temp }}/profile-landscape"
      - uses: actions/upload-artifact@v7
        with:
          name: profile-landscape
          path: ${{ runner.temp }}/profile-landscape/profile-research-*.json
          if-no-files-found: error
          retention-days: 30
