name: Profile landscape snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 1 * *'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect public profile references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/research-profiles.py
      - uses: actions/upload-artifact@v7
        with:
          name: profile-landscape
          path: docs/profile-research-*.json
          retention-days: 30
