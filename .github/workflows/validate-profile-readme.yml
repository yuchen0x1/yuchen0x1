name: Validate Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - README.md
      - repo-descriptions.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/**
      - docs/**
  pull_request:
    paths:
      - README.md
      - repo-descriptions.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/**
      - docs/**

concurrency:
  group: profile-readme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: README health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test snapshot scripts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test README validation
        shell: pwsh
        run: ./tests/test-validate-readme.ps1

      - name: Validate README and repository links
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/validate-readme.ps1 -CheckLinks
