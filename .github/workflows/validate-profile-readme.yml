name: Validate Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - README.md
      - repo-descriptions.md
      - assets/**
      - scripts/validate-readme.ps1
      - .github/workflows/validate-profile-readme.yml
      - docs/**
  pull_request:
    paths:
      - README.md
      - repo-descriptions.md
      - assets/**
      - scripts/validate-readme.ps1
      - .github/workflows/validate-profile-readme.yml
      - docs/**

permissions:
  contents: read

jobs:
  validate:
    name: README health check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate README and repository links
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/validate-readme.ps1 -CheckLinks
